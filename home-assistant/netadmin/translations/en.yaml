configuration:
  dhcp_backend:
    name: Legacy DHCP backend
    description: >-
      Initial fallback only. Manage connections in NetAdmin Settings after sign-in.
      Saved in-app settings take precedence. This does not migrate a DHCP server.
  dns_server:
    name: Legacy DNS server
    description: >-
      Initial Bind address fallback. Manage connections in NetAdmin Settings.
      Saved in-app settings take precedence.
  dns_zones:
    name: Legacy DNS zones
    description: >-
      Initial comma-separated authoritative zone fallback. Blank does not discover
      remote zones. Manage connections in NetAdmin Settings after sign-in.
  dhcp_agent_url:
    name: Legacy DHCP agent URL
    description: >-
      Initial DHCP HTTPS endpoint fallback. Manage connections in NetAdmin Settings.
      Saved in-app settings take precedence.
  radius_agent_url:
    name: Legacy RADIUS agent URL
    description: >-
      Initial RADIUS HTTPS endpoint fallback. Manage connections in NetAdmin Settings.
      Saved in-app settings take precedence.
