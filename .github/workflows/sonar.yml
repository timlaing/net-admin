name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary :all: "uv==0.13.1"
          uv sync --locked --no-build --extra dev
      - name: Run tests and generate Python coverage
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m coverage xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run UI tests and generate JavaScript coverage
        run: >-
          npm exec --yes --package=c8@12.0.0 -- c8
          --reporter=lcov --reporter=text --reports-dir=coverage-js
          --include='netadmin/static/*.js'
          node --input-type=module -e
          "await import('./Tools/test_ui.mjs'); await import('./Tools/test_subnet_ui.mjs');"
      - name: Analyze and enforce quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
