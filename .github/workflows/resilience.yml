name: Resilience failure paths
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m pip install --only-binary :all: "uv==0.13.1"
          uv sync --locked --no-build --extra dev
      - name: Exercise failure paths without changing production state
        run: .venv/bin/python -m pytest tests/test_update_fault_injection.py tests/test_ca_download_security.py tests/test_transactions.py --no-cov -q
      - name: Verify real Docker health rejection and checkpoint retention
        run: sudo -- .venv/bin/python Tools/smoke_update_failure.py
