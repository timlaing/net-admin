name: Analysis inputs
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: analysis-inputs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary :all: "uv==0.13.1"
          uv sync --locked --no-build --extra dev
      - name: Run tests and generate Python coverage
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m coverage xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Run UI tests and generate JavaScript coverage
        run:
          npm exec --yes --package=c8@12.0.0 -- c8 --reporter=lcov --reporter=text --reports-dir=coverage-js --include='netadmin/static/*.js'
          node --input-type=module -e "await import('./Tools/test_ui.mjs'); await import('./Tools/test_delete_ui.mjs');
          await import('./Tools/test_subnet_ui.mjs');"
      - name: Record analysis revision
        run: git rev-parse HEAD > coverage-revision.txt
      - name: Collect analysis inputs
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('.')
          out = root / '.analysis-inputs'
          out.mkdir()
          patterns = ['coverage-revision.txt', 'coverage.xml', 'coverage.out', 'lcov.info', 'coverage/**', 'coverage-js/lcov.info', 'gcov/**', 'build/compile_commands.json', 'dist/**']
          if not (root / 'coverage-js/lcov.info').is_file():
              raise SystemExit('Required UI coverage report is missing')
          count = 0
          for pattern in patterns:
              for source in root.glob(pattern):
                  if source.is_symlink():
                      raise SystemExit('Symlink is not an analysis input')
                  if source.is_file():
                      target = out / source
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                      count += 1
          if not count:
              raise SystemExit('No analysis inputs were generated')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: analysis-inputs
          path: .analysis-inputs/
          if-no-files-found: error
          retention-days: "7"
          include-hidden-files: true
    permissions:
      contents: read
    name: Generate analysis inputs
  validation-result:
    name: Validate analysis-inputs
    needs:
      - coverage
      - workflow-tooling
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation incomplete: ' + ', '.join(failed))
          PY
  workflow-tooling:
    name: Workflow tooling coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Measure policy and coordinator coverage
        run: |
          python3 -m pip install --only-binary=:all: PyYAML==6.0.3 coverage==7.11.0
          mkdir -p coverage-workflow
          python3 -m coverage run --branch --source=.github/scripts -m unittest discover -s .github/scripts
          python3 -m coverage xml -o coverage-workflow/python.xml
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage-workflow/javascript.lcov .github/scripts/*.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflow-tooling-coverage
          path: coverage-workflow/
          if-no-files-found: error
          retention-days: 7
